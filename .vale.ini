StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Handbook

Packages = Google

[*.md]
BasedOnStyles = Vale, Google

# Google's full rule set is tuned for product docs, not a long-form technical
# handbook — disable the rules that fired constantly as noise on the pilot
# chapters (em dashes, parenthetical asides, passive voice, "e.g./i.e.",
# sentence-case headings, "chapter" word-choice). Keep spelling + acronyms.
Google.EmDash = NO
Google.Parens = NO
Google.Passive = NO
Google.Latin = NO
Google.Headings = NO
Google.WordListCase = NO
Google.Semicolons = NO
Google.Colons = NO
Vale.Terms = NO
