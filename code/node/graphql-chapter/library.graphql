enum BookFormat {
  HARDCOVER
  PAPERBACK
  DIGITAL
}

type Author {
  id: ID!
  name: String!
}

type Book {
  id: ID!
  title: String!
  format: BookFormat!
  author: Author!
}

union SearchResult = Book | Author

input CreateBookInput {
  title: String!
  format: BookFormat!
  authorId: ID!
}

type Query {
  book(id: ID!): Book
  books(first: Int = 20): [Book!]!
  search(term: String!): [SearchResult!]!
}

type Mutation {
  createBook(input: CreateBookInput!): Book!
}