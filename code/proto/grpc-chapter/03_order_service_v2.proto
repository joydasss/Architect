syntax = "proto3";

package acme.orders.v1;

option go_package = "example.com/acme/orders/gen;ordersv1";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_ACCEPTED = 1;
  ORDER_STATUS_ALLOCATING = 2;
  ORDER_STATUS_SHIPPED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

message Order {
  string order_id = 1;
  OrderStatus status = 2;
  int64 created_at_unix_ms = 3;
  reserved 4;
  reserved "legacy_reference";
  string fulfillment_region = 5;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message OrderEvent {
  string order_id = 1;
  int64 sequence = 2;
  OrderStatus status = 3;
  int64 occurred_at_unix_ms = 4;
}

message UploadSummary {
  uint64 accepted_count = 1;
  uint64 rejected_count = 2;
}

message WatchOrderRequest {
  string order_id = 1;
  int64 after_sequence = 2;
}

message InventoryUpdate {
  string sku = 1;
  int64 available_units = 2;
  string update_id = 3;
}

message InventoryAck {
  string update_id = 1;
  bool accepted = 2;
  string reason = 3;
}

service OrderService {
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc UploadOrderEvents(stream OrderEvent) returns (UploadSummary);
  rpc WatchOrder(WatchOrderRequest) returns (stream OrderEvent);
  rpc SyncInventory(stream InventoryUpdate) returns (stream InventoryAck);
}