openapi: 3.1.1
info:
  title: Orders API
  summary: Create and retrieve customer orders.
  description: |
    Example contract for a resource-oriented HTTP orders API. The contract
    describes requests and responses; it does not itself implement token
    verification, authorization, idempotency, callback delivery, or business
    invariants.
  version: 1.0.0
  contact:
    name: Orders API team
    email: api-team@example.test
servers:
  - url: https://api.example.test/v1
    description: Example HTTPS endpoint for documentation and testing.
tags:
  - name: Orders
    description: Create, list, and retrieve orders.
security:
  - ServiceOAuth:
      - orders:read
paths:
  /orders:
    get:
      tags:
        - Orders
      operationId: listOrders
      summary: List orders visible to the caller.
      description: Returns one bounded page in creation order.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          description: Opaque continuation token returned by the previous page.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
          example: eyJvZmZzZXQiOjI1fQ
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              examples:
                firstPage:
                  summary: First page with a continuation token.
                  value:
                    items:
                      - id: 7b1d4fb7-8403-4c65-8dc5-fc4e4b95a799
                        customerId: 09ac48d2-b115-4ec3-ae15-4ba830b9ba11
                        status: pending
                        createdAt: '2026-09-28T10:15:30Z'
                        currency: USD
                        total: 29.98
                        items:
                          - sku: mug-blue
                            quantity: 2
                            unitPrice: 14.99
                    nextCursor: eyJvZmZzZXQiOjI1fQ
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '429':
          $ref: '#/components/responses/RateLimitedProblem'
        default:
          $ref: '#/components/responses/UnexpectedProblem'
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Create an order.
      description: |
        The caller supplies a stable idempotency key. Repeating a request with
        the same key and same payload returns the original result; reuse with a
        different payload is rejected. The server, not this description,
        implements and persists that behavior.
      security:
        - ServiceOAuth:
            - orders:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Customer and line items, with an optional callback destination.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              createOrder:
                summary: Create an order with two units of one product.
                value:
                  customerId: 09ac48d2-b115-4ec3-ae15-4ba830b9ba11
                  currency: USD
                  items:
                    - sku: mug-blue
                      quantity: 2
                      unitPrice: 14.99
      callbacks:
        orderStatus:
          '{$request.body#/callbackUrl}':
            post:
              operationId: receiveOrderStatusCallback
              summary: Receive an order status notification.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OrderStatusEvent'
              responses:
                '202':
                  description: The callback receiver accepted the notification.
                default:
                  description: Callback receiver rejected or could not process the notification.
      responses:
        '201':
          description: Order created.
          headers:
            Location:
              description: URI of the created order.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                createdOrder:
                  summary: Newly created pending order.
                  value:
                    id: 7b1d4fb7-8403-4c65-8dc5-fc4e4b95a799
                    customerId: 09ac48d2-b115-4ec3-ae15-4ba830b9ba11
                    status: pending
                    createdAt: '2026-09-28T10:15:30Z'
                    currency: USD
                    total: 29.98
                    items:
                      - sku: mug-blue
                        quantity: 2
                        unitPrice: 14.99
          links:
            readCreatedOrder:
              operationId: getOrder
              parameters:
                orderId: '$response.body#/id'
              description: Retrieve the resource created by this operation.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '429':
          $ref: '#/components/responses/RateLimitedProblem'
        default:
          $ref: '#/components/responses/UnexpectedProblem'
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        description: Stable identifier of the order.
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Orders
      operationId: getOrder
      summary: Retrieve an order.
      responses:
        '200':
          description: The order representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                pendingOrder:
                  summary: Pending order with one line item.
                  value:
                    id: 7b1d4fb7-8403-4c65-8dc5-fc4e4b95a799
                    customerId: 09ac48d2-b115-4ec3-ae15-4ba830b9ba11
                    status: pending
                    createdAt: '2026-09-28T10:15:30Z'
                    currency: USD
                    total: 29.98
                    items:
                      - sku: mug-blue
                        quantity: 2
                        unitPrice: 14.99
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '429':
          $ref: '#/components/responses/RateLimitedProblem'
        default:
          $ref: '#/components/responses/UnexpectedProblem'
webhooks:
  orderStatusChanged:
    post:
      tags:
        - Orders
      operationId: handleOrderStatusWebhook
      summary: Receive an order status change notification.
      description: |
        The provider initiates this request independently of an API call.
        The receiver must verify the documented signature over the raw body,
        reject replays, and process duplicate event IDs idempotently.
      security:
        - WebhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusEvent'
      responses:
        '202':
          description: Event accepted for asynchronous processing.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        default:
          $ref: '#/components/responses/UnexpectedProblem'
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of orders to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Stable key used to deduplicate retries of this create request.
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    ValidationProblem:
      description: Request syntax or field validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            invalidQuantity:
              $ref: '#/components/examples/InvalidQuantity'
    UnauthorizedProblem:
      description: Credentials are missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenProblem:
      description: The authenticated caller is not permitted to perform this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundProblem:
      description: The order does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missingOrder:
              $ref: '#/components/examples/OrderNotFound'
    ConflictProblem:
      description: The request conflicts with the current order or idempotency state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimitedProblem:
      description: The caller exceeded the service's admission policy.
      headers:
        Retry-After:
          description: Delay before a client should retry, when supplied by the provider.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnexpectedProblem:
      description: An unclassified failure response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  examples:
    InvalidQuantity:
      summary: A line item quantity must be positive.
      value:
        type: https://api.example.test/problems/validation
        title: Request validation failed
        status: 400
        detail: One or more submitted fields are invalid.
        errors:
          - pointer: /items/0/quantity
            detail: Must be greater than zero.
    OrderNotFound:
      summary: Requested order is unavailable.
      value:
        type: https://api.example.test/problems/not-found
        title: Order not found
        status: 404
        detail: No visible order matches the supplied identifier.
  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - customerId
        - items
      properties:
        customerId:
          type: string
          format: uuid
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: USD
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CreateOrderItem'
        callbackUrl:
          type: [string, 'null']
          format: uri
          description: Optional callback destination for this create operation.
          examples:
            - https://consumer.example.test/hooks/order-status
    CreateOrderItem:
      type: object
      additionalProperties: false
      required:
        - sku
        - quantity
        - unitPrice
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 80
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        unitPrice:
          type: number
          minimum: 0
          multipleOf: 0.01
    Order:
      type: object
      additionalProperties: false
      required:
        - id
        - customerId
        - status
        - createdAt
        - currency
        - total
        - items
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customerId:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          enum:
            - pending
            - accepted
            - fulfilled
            - cancelled
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        total:
          type: number
          minimum: 0
          multipleOf: 0.01
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderItem'
    OrderPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Order'
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page, or null when there is no next page.
    OrderStatusEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - orderId
        - status
        - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - accepted
            - fulfilled
            - cancelled
        occurredAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 9457 Problem Details base shape with a service request identifier.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
          readOnly: true
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ValidationIssue'
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
        - pointer
        - detail
      properties:
        pointer:
          type: string
          description: JSON Pointer to the invalid request property.
        detail:
          type: string
  securitySchemes:
    ServiceOAuth:
      type: oauth2
      description: |
        Documents the OAuth scope expected by each operation. The gateway or
        service must acquire and validate tokens and enforce the resulting
        principal and scope; this declaration implements none of those checks.
      flows:
        clientCredentials:
          tokenUrl: https://identity.example.test/oauth/token
          scopes:
            orders:read: Read orders visible to the caller.
            orders:write: Create orders for an authorized customer.
    WebhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: |
        Documents the signature header expected by the receiver. The receiver
        must verify the signature algorithm, key rotation, body canonicalization,
        timestamp, and replay policy in runtime code.
